<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SIKAS RT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIKAS RT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#064e3b;overflow:hidden}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f2f7f5}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#064e3b,#0b7a5e);color:#fff;font-family:system-ui,sans-serif;transition:opacity .4s}
#ld img{width:88px;height:88px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#ld b{font-size:20px;letter-spacing:.5px}
#ld small{opacity:.8}
#ld a{display:none;color:#fff;background:rgba(255,255,255,.18);padding:10px 16px;border-radius:12px;text-decoration:none;margin-top:6px}
.sp{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><b>SIKAS RT</b><div class="sp"></div><small id="m">Memuat aplikasi…</small>
<a id="alt" href="https://script.google.com/macros/s/AKfycbzOI_dWAlqicmRow59vTnuagQLNMKufbWQ_Q-1X8YUJ2D5NEbBGfibHWslQvP0L5zPi/exec" target="_top">Buka langsung</a></div>
<iframe id="f" title="SIKAS RT" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
(function(){
var URL_APP='https://script.google.com/macros/s/AKfycbzOI_dWAlqicmRow59vTnuagQLNMKufbWQ_Q-1X8YUJ2D5NEbBGfibHWslQvP0L5zPi/exec',f=document.getElementById('f'),ld=document.getElementById('ld'),done=false;
f.onload=function(){done=true;ld.style.opacity='0';setTimeout(function(){ld.style.display='none';},450);};
f.src=URL_APP;
setTimeout(function(){if(!done){document.getElementById('m').textContent='Memuat lebih lama dari biasa…';document.getElementById('alt').style.display='inline-block';}},12000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
